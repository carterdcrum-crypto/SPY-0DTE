[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-0dte-engine"
version = "0.4.0"
description = "Simulation-first SPY 0DTE research, risk, execution, and mobile control engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "google-auth>=2.40,<3",
    "cryptography>=41,<43",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]
webull = ["webull-openapi-python-sdk"]
thetadata = ["thetadata>=1.0.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["engine*"]
