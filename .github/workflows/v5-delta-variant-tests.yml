name: v5-delta-variant-tests
on:
  push:
    branches: [main]
    paths:
      - 'engine/v5_close_only_operational.py'
      - 'tests/test_v5_close_only_live.py'
      - 'tests/test_v5_867k_policy_parity.py'
      - '.github/workflows/v5-delta-variant-tests.yml'
  workflow_dispatch:

jobs:
  v5-delta-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Verify both V5 entry paths, IV/RV and quote safeguards
        run: pytest -q tests/test_v5_close_only_live.py tests/test_v5_867k_policy_parity.py tests/test_v5_profile_lock.py
