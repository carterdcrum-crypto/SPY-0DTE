name: exit-policy-research-tests
on:
  push:
    branches: [research/exit-trailing20-vs-50]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_exit_policy_comparison.py
      - run: python -m compileall -q engine/exit_policy_comparison.py
