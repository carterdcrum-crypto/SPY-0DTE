name: exit-policy-research-tests
on:
  push:
    branches: [research/exit-trailing20-vs-50, research/event-nbbo-acquisition-preflight, research/trailing-only-sensitivity-20261011, research/cost-aware-entry-edge-20261011, research/morning-window-0930-1100-20261011, research/0930-1100-no-target-entry-combos-20261011, research/or-retest-frequency-20261011, research/option-net-edge-walkforward-20261012, research/1000-starting-balance-20261012]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q tests/test_exit_policy_comparison.py tests/test_spy_event_data_preflight.py tests/test_trailing_only_sweep.py tests/test_entry_filter_30pct_study.py tests/test_deferred_reversal_30pct_study.py tests/test_cost_aware_entry_edge.py tests/test_morning_0930_1100_study.py tests/test_no_tp_morning_entry_combos.py tests/test_or_retest_frequency.py tests/test_settled_cash_ledger_audit.py tests/test_option_net_edge_walkforward.py
      - run: python -m compileall -q engine/exit_policy_comparison.py engine/spy_event_data_preflight.py engine/trailing_only_sweep.py engine/entry_filter_30pct_study.py engine/deferred_reversal_30pct_study.py engine/cost_aware_entry_edge.py engine/morning_0930_1100_study.py engine/no_tp_morning_entry_combos.py engine/or_retest_frequency.py engine/settled_cash_ledger_audit.py engine/option_net_edge_walkforward.py
