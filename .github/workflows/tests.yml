name: engine-tests

on:
  push:
    branches: [main, research/weekly-options-walkforward, research/free-signal-screen, research/breakout-failure-audit, research/causal-breakout-router, research/continuation-regime-gate, research/magnitude-edge-forecast, research/joint-direction-magnitude-calibration, research/macd-rsi-sma-tape-fusion, research/weighted-multisetup-daily-coverage, research/spy-0dte-vs-1dte-paired-quote]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
