name: engine-tests

on:
  push:
    branches: [main, research/weekly-options-walkforward, research/free-signal-screen, research/breakout-failure-audit]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: pytest -q
